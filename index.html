<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>12 Second Picture</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
}
#play {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: #159447;
  cursor: pointer;
}
#stage {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
}
#stage[hidden] { display: none; }
#poster {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
</style>
</head>
<body>

<button id="play" aria-label="شروع"></button>

<div id="stage" hidden>
  <img id="poster"
  src="./file_00000000d6e48243adcdcd8bb099c261.png">
</div>

<audio id="audio" src="./music.mp3" preload="auto"></audio>

<script>
const button = document.getElementById("play");
const stage = document.getElementById("stage");
const audio = document.getElementById("audio");

let started = false;

button.addEventListener("click", async () => {
  if (started) return;

  started = true;
  button.hidden = true;
  stage.hidden = false;

  try {
    audio.currentTime = 0;
    await audio.play();
  } catch (error) {
    stage.hidden = true;
    button.hidden = false;
    started = false;
    return;
  }

  setTimeout(() => {
    audio.pause();
    audio.currentTime = 0;
    stage.hidden = true;
    button.hidden = false;
    started = false;
  }, 12000);
});
</script>

</body>
</html>
